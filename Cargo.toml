[package]
name = "key-share-repair"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Threshold key-share repair"
repository = "https://github.com/LFDT-Lockness/key-share-repair"
categories = ["algorithms", "cryptography"]
keywords = ["mpc", "threshold-signatures", "tss", "key-repair"]

[dependencies]
key-share = { version = "0.7", default-features = false, features = ["std"] }
generic-ec = { version = "0.5", default-features = false, features = ["std", "serde"] }
generic-ec-zkp = { version = "0.5", default-features = false, features = ["std"] }
round-based = { version = "0.4.1", default-features = false, features = ["derive"] }
rand_core = { version = "0.6", default-features = false }
serde = { version = "1", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "alloc"] }
displaydoc = { version = "0.2", default-features = false }
thiserror = "1"

[features]
default = []
hd-wallet = ["key-share/hd-wallet"]

[dev-dependencies]
key-share = { version = "0.7", default-features = false, features = ["std", "spof", "hd-wallet"] }
generic-ec = { version = "0.5", default-features = false, features = ["std", "curve-secp256k1"] }
round-based = { version = "0.4.1", default-features = false, features = ["derive", "sim"] }
rand = "0.8"
