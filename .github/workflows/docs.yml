name: Build spec

permissions:
  contents: read

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main" ]

jobs:
  build_pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
    - name: Compile LaTeX document
      uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b #v4.1.0
      with:
        root_file: key-repair.tex
        working_directory: spec
    - name: Rename PDF
      run: mv spec/key-repair.pdf spec/key-repair-spec.pdf
    - name: Upload artifacts
      id: upload-pdf
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: spec-pdf
        path: spec/key-repair-spec.pdf
    - name: Leave PR comment
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 #v2
      with:
        header: spec_is_built
        message: The spec was successfully compiled. PDF is available [here](${{ steps.upload-pdf.outputs.artifact-url }}).
